name: linux

on:
  push:
    branches: [ main, gow3 ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release (no debug info): faster to compile, much smaller to package. ccache is capped so
      # the Actions cache stays small.
      GOW3_BUILD_TYPE: Release
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('src/**', 'gpu/shim/**', 'gpu/shadps4/**', 'gpu/CMakeLists.txt', 'build.sh', 'ci/environment.yml') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Dependency environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash

      - name: Build the source-only dependencies (robin-map, Zydis, Vulkan-Headers)
        shell: bash -el {0}
        run: bash ci/setup-deps.sh "$CONDA_PREFIX"

      - name: Build the port
        shell: bash -el {0}
        run: |
          source ci/env.sh
          bash build.sh

      - name: Tests
        shell: bash -el {0}
        run: |
          source ci/env.sh
          python3 -m unittest discover -s tests
          bash build.sh --test

      - name: Package (Linux / Steam Deck)
        shell: bash -el {0}
        run: |
          source ci/env.sh
          bash packaging/linux.sh
          tar -czf dist/gow3-linux-x86_64.tar.gz -C dist gow3-linux

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: gow3-linux
          path: dist/gow3-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gow3-linux
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: gow3-linux-x86_64.tar.gz
          generate_release_notes: true
