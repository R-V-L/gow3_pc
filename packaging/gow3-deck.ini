# Steam Deck tuning (1280x800 panel).
# The game's projection is 16:9, so 720p keeps the correct aspect and the presenter letterboxes
# it into the 16:10 panel (small black bars). The engine runs at its native 60 (no 120 FPS
# patch). FSR 1/RCAS are enabled but idle at 720p (the upscaler only runs when both output
# dimensions are larger than the 16:9 image); they engage if you drop to 480p.
# "800p" (1280x800) fills the panel but the game stretches 16:9 into 16:10 -- use it only if you
# prefer filling over a correct aspect.
render_resolution=720p
engine_fps=60
fps_limit=60
upscaler=off
fsr1=1
rcas=1
display_mode=borderless
vsync=1
deferred_readback=1
stale_readback=1
async_shaders=1
frames_queued=1
