name: Rust launcher

on:
  push:
    paths:
      - 'launcher-rust/**'
      - '.github/workflows/rust-launcher.yml'
  pull_request:
    paths:
      - 'launcher-rust/**'
      - '.github/workflows/rust-launcher.yml'
  workflow_dispatch:
    inputs:
      snapshots:
        description: Regenerate the Windows UI snapshot references and upload them
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher-rust -> target
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Update Windows UI snapshots
        if: inputs.snapshots && runner.os == 'Windows'
        env:
          UPDATE_SNAPSHOTS: "1"
        run: cargo test --test ui_snapshots -- game -- --nocapture
      - name: Test
        if: ${{ !inputs.snapshots }}
        run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        if: inputs.snapshots && runner.os == 'Windows'
        with:
          name: ui-snapshots
          path: launcher-rust/snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: spartanport-launcher-${{ matrix.os }}
          path: launcher-rust/target/release/spartanport-launcher*
