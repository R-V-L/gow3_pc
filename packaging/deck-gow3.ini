# Steam Deck tuning (1280x800 panel).
# The scene renders at the panel's 1280x800 (16:10) and the engine runs at its native 60 (no
# 120 FPS patch), then FSR 1 upscales to the window. This is the biggest win over the defaults
# (1080p + 120 FPS).
render_resolution=800p
engine_fps=60
fps_limit=60
upscaler=off
fsr1=1
rcas=1
display_mode=borderless
vsync=1
deferred_readback=1
stale_readback=1
async_shaders=1
frames_queued=1
